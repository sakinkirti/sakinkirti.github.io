  text: "Presented a poster on a [high-throughput contractility assay](/files/MGB-GCTI.pdf) for human cardiac organoids at the Mass General Brigham Gene and Cell Therapy Institute Symposium."

- date: 2023-07-01
  text: "Joined the Broad Institute as a Computational Associate, working on computer vision for cardiovascular drug discovery."

